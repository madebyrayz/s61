<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- A tilted streak inside a ring: the anamorphic smear, seen from the wrong place.
       Ink follows the browser's colour scheme; the page's own theme toggle cannot reach a tab icon. -->
  <style>
    .ring { fill: none; stroke: #111; stroke-width: 2; }
    .streak { fill: #111; }
    @media (prefers-color-scheme: dark) { .ring { stroke: #f2f2f2; } .streak { fill: #f2f2f2; } }
  </style>
  <circle class="ring" cx="16" cy="16" r="13.5" />
  <ellipse class="streak" cx="16" cy="16" rx="9.5" ry="3.2" transform="rotate(-32 16 16)" />
</svg>
