<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Gesture Echo</title>
    <style>
      html, body { margin: 0; height: 100%; background: #060607; overflow: hidden; }
      canvas { display: block; touch-action: none; }
      #hint {
        position: fixed; left: 0; right: 0; bottom: 22px;
        text-align: center; pointer-events: none;
        font: 12px/1.4 ui-sans-serif, system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
        letter-spacing: 0.04em; color: rgba(255, 255, 255, 0.42);
        transition: opacity 1.2s ease;
      }
      #hint b { font-weight: 500; color: rgba(255, 255, 255, 0.7); }
      #hint.hidden { opacity: 0; }
    </style>
  </head>
  <body>
    <div id="hint">
      draw a gesture, then let go &nbsp;·&nbsp; <b>+ −</b> copies &nbsp;·&nbsp; <b>M</b> mirror
      &nbsp;·&nbsp; <b>C</b> clear &nbsp;·&nbsp; <b>S</b> save &nbsp;·&nbsp; <b>H</b> hide
    </div>
    <script src="p5.min.js"></script>
    <script src="sketch.js"></script>
  </body>
</html>
